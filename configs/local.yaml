env : "local"

http_server:
  address: "localhost:8082"
  timeout: 4s
  iddle_timeout: 60s

rpc_auth_client:
  env: "local"
  storage_path: "./storage/sso.db"
  token_ttl: 1h
  grpc: 
    port: 44045
    timeout: 10h
    
race_limit:
  bucket_cap: 50
  filling_speed: 10
  req_weight: 1
  strategy: "decine"
  token_life: "1m"
  
cache:
  addr: ""
  password: ""
  db: 0
  max_retries: 1
  dial_timeout: "1s"
  timeout: "1s"